name: Upload python packages

# The npm package (wasm/) is published by release-npm.yml from the same
# release, independently: a failure in one does not block the other.
#
# "[skip pypi]" in the release notes when the release is created skips
# building and publishing the Python packages (release notes are still
# generated), e.g. `gh release create v0.1.1 --notes "[skip pypi]"`.
#
# PyPI uses trusted publishing: on pypi.org, project remarkable-annotations >
# Publishing: GitHub, repository bpiwowar/remarkable-annotations, workflow
# release.yml, environment pypi.

on:
  release:
    types: [created]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$tag" != "$version" ]; then
            echo "::error file=Cargo.toml::Release tag $GITHUB_REF_NAME does not match Cargo.toml version $version. Bump [workspace.package] version in Cargo.toml (and Cargo.lock), then recreate the release."
            exit 1
          fi
          echo "Version $version matches tag $GITHUB_REF_NAME"

  # abi3 wheels: one per platform, for every Python >= 3.10
  wheels:
    needs: check-version
    if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64, name: linux-aarch64 }
          - { runner: windows-latest, target: x64, name: windows-x64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: 'true'
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  sdist:
    needs: check-version
    if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    # Also runs (for the release notes) when the builds were skipped
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    needs: [wheels, sdist]
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate changelog for this release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      - name: List the registries in the release notes
        env:
          SKIP_PYPI: ${{ contains(github.event.release.body, '[skip pypi]') }}
          SKIP_NPM: ${{ contains(github.event.release.body, '[skip npm]') }}
        run: |
          version=${GITHUB_REF_NAME#v}
          registries=""
          [ "$SKIP_PYPI" = true ] || registries="[PyPI](https://pypi.org/project/remarkable-annotations/$version/)"
          [ "$SKIP_NPM" = true ] || registries="${registries:+$registries, }[npm](https://www.npmjs.com/package/remarkable-annotations/v/$version)"
          {
            echo "**Published to:** ${registries:-none}"
            echo
            cat release-notes.md
          } > release-notes.tmp && mv release-notes.tmp release-notes.md
      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
      - uses: actions/download-artifact@v7
        if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        if: ${{ !contains(github.event.release.body, '[skip pypi]') }}
        uses: pypa/gh-action-pypi-publish@release/v1
