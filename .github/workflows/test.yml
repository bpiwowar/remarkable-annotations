name: CI test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - run: cargo fmt --all --check
    - run: cargo clippy --all-targets --features python -- -D warnings
    - run: cargo test

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
      with:
        # also restored by release-npm.yml
        shared-key: wasm
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack@0.15.1
    - name: WebAssembly build against the fixtures
      run: wasm/tests/check.sh

  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: astral-sh/setup-uv@v6
    - name: Build and test
      run: |
        uv venv --python 3.12
        uv pip install maturin pytest
        uv run --no-project maturin develop --uv --release
        uv run --no-project pytest python -v

  reference:
    # The rmapi-js reference files are up to date with the fixtures
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # rmapi-js uses Uint8Array.prototype.toHex (Node >= 25): on older Node it
    # leaves author tables unparsed
    - uses: actions/setup-node@v5
      with:
        node-version: '26'
    - working-directory: tests/reference
      run: npm ci && npm run dump
    - run: git diff --exit-code tests/fixtures
